version: "2"

linters:
  default: all

  disable:
    - depguard
    - exhaustruct
    - godot
    - godox
    - gomodguard # Deprecated (replaced by gomodguard_v2)
    - gomodguard_v2
    - gosec
    - lll
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl # Deprecated (replaced by wsl_v5)

  exclusions:
    rules:
      - linters:
          - wsl_v5
        text: "missing whitespace above this line"
    paths:
      - cmd/parser/
      - cmd/validator/
      - cmd/validator-v2/
      - generator/fixtures/
      - openapi/client_example.go

  settings:
    gosec:
      excludes:
        - G306

    revive:
      enable-default-rules: true # CRITICAL: Prevents revive from disabling all other default rules
      rules:
        - name: package-comments
          disabled: true

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/artem-kuznetsov-intellectsoft/openapi2go
    gofumpt:
      extra-rules: true
