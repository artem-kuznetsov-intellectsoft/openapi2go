version: "2"

linters:
  default: all

  disable:
    - depguard
    - exhaustruct
    - funlen
    - godot
    - godox
    - gomodguard
    - gomodguard_v2
    - lll
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

  settings:
    gosec:
      excludes:
        - G306 # Expect WriteFile permissions to be 0600 or less
    revive:
      enable-default-rules: true # Ensure general default checks are still run

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/artem-kuznetsov-intellectsoft/openapi2go
    gofumpt:
      extra-rules: true

issues:
  new: true
