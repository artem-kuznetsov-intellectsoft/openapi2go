version: "2"

linters:
  default: all

  disable:
    - depguard
    - exhaustruct
    - funlen
    - godot
    - godox
    - gomodguard # Deprecated (replaced by gomodguard_v2)
    - gomodguard_v2
    - lll
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl # Deprecated (replaced by wsl_v5)
    - wsl_v5

  exclusions:
    paths:
      - cmd/parser/
      - cmd/validator/
      - cmd/validator-v2/
      - generator/fixtures/
      - '(.+)_example\.go'
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

  settings:
    gosec:
      excludes:
        - G306 # Expect WriteFile permissions to be 0600 or less
    revive:
      enable-default-rules: true # Ensure general default checks are still run

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/artem-kuznetsov-intellectsoft/openapi2go
    gofumpt:
      extra-rules: true
