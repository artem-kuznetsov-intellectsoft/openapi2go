version: "2"

linters:
  default: all

  disable:
    - depguard
    - exhaustruct
    - funlen
    - godot
    - godox
    - gomodguard
    - gomodguard_v2
    - lll
    - nlreturn
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
    - wsl_v5

  exclusions:
    generated: lax

    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    paths:
      # Generated output. Anchored on .gen.go so the hand-written
      # client_exec_test.go files in the same directories stay linted.
      #
      # The client runtime is copied whole into each generated package, so
      # every package that uses only part of it reports the rest as unused —
      # inherent to the mechanism, not a defect. The runtime is linted and
      # tested at its source, openapi/clientruntime.
      - generator/fixtures/.*\.gen\.go$

    rules:
      # Table-driven tests trip these by construction; the signal is not worth
      # the noise in test code.
      - path: _test\.go
        linters:
          - dupl
          - err113
          - goconst
          - gochecknoglobals
          - gosec
          - maintidx
          - mnd
          - perfsprint

  settings:
    gosec:
      excludes:
        - G306 # Expect WriteFile permissions to be 0600 or less
    revive:
      enable-default-rules: true # Ensure general default checks are still run

formatters:
  enable:
    - goimports
    - gofumpt
  settings:
    goimports:
      local-prefixes:
        - github.com/artem-kuznetsov-intellectsoft/openapi2go
    gofumpt:
      extra-rules: true

issues:
  new: true
